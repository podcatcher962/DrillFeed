<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DrillFeed · RSS 阅读器</title>
<style>
:root{--bg:#F5F5F5;--card:#FFF;--accent:#7C4DFF;--fg:#212121;--fg2:#757575;--border:#E0E0E0;--green:#43A047;--orange:#FF9100;--red:#FF5252;--blue:#448AFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei UI','PingFang SC',sans-serif;background:var(--bg);color:var(--fg);max-width:760px;margin:0 auto;padding:8px;min-height:100vh;display:flex;flex-direction:column}
.title-bar{flex-shrink:0;background:var(--accent);color:#fff;padding:12px 16px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:space-between}
.title-bar h1{font-size:18px;margin:0}
.title-bar .sub{font-size:12px;opacity:0.85}
.right-btn{display:flex;gap:6px}
.right-btn a{background:#4A148C;color:#fff;text-decoration:none;padding:6px 12px;border:none;border-radius:4px;font-size:12px;white-space:nowrap;font-weight:600;cursor:pointer}
.info-bar{flex-shrink:0;display:flex;gap:12px;padding:6px 16px;background:#F3E5FF;border:1px solid var(--accent);border-top:none;font-size:12px;font-weight:600;flex-wrap:wrap}
.info-bar a{color:var(--accent);text-decoration:none}
.info-bar a:hover{text-decoration:underline}
.main{flex:1;display:flex;min-height:0}
.left{width:280px;flex-shrink:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-top:none;border-right:none;overflow-y:auto}
.cat-group{margin:0}
.cat-header{font-size:11px;font-weight:700;color:var(--accent);padding:8px 10px 3px;border-bottom:1px solid #E0D0FF;background:#F8F4FF;cursor:pointer}
.cat-header:hover{background:#EEE5FF}
.feed-item{padding:6px 10px 6px 16px;cursor:pointer;font-size:11px;line-height:1.5;border-bottom:1px solid #F5F5F5;display:flex;justify-content:space-between;align-items:center}
.feed-item:hover{background:#F0EBFF}
.feed-item.active{background:var(--accent);color:#fff;font-weight:700}
.feed-item .url-hint{font-size:9px;color:var(--fg2);opacity:0.5;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-item.active .url-hint{color:rgba(255,255,255,0.6)}
.right{flex:1;display:flex;flex-direction:column;min-width:0}
.article-list{flex:1;min-height:0;background:var(--card);border:1px solid var(--border);border-top:none;border-left:none;overflow-y:auto}
.art-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #F0F0F0;font-size:12px;line-height:1.5}
.art-item:hover{background:#F8F4FF}
.art-item.selected{background:#EEE8FF;border-left:3px solid var(--accent)}
.art-item .art-title{font-weight:600;margin-bottom:2px}
.art-item .art-meta{font-size:10px;color:var(--fg2)}
.content-area{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-top:none;border-left:none;padding:12px 14px;max-height:200px;overflow-y:auto;font-size:12px;line-height:1.7;border-radius:0 0 8px 0}
.content-area h3{margin-bottom:6px;color:var(--accent);font-size:14px}
.content-area .summary{color:var(--fg);font-size:12px;white-space:pre-wrap;max-height:110px;overflow-y:auto}
.content-area a{color:var(--accent);font-size:12px}
.empty-state{text-align:center;padding:40px 20px;color:var(--fg2);font-size:13px}
footer{flex-shrink:0;text-align:center;color:var(--fg2);font-size:10px;padding:10px 0 6px}
footer a{color:var(--accent);text-decoration:none}
.load-status{font-size:10px;color:var(--fg2);padding:4px 10px;text-align:center;background:#FFF;border:1px solid var(--border);border-top:none;border-left:none}
@media(max-width:560px){.left{width:180px}.feed-item{font-size:10px}}
</style>
</head>
<body>
<div class="title-bar">
  <div style="display:flex;align-items:center;gap:12px">
    <h1>🔬 DrillFeed</h1>
    <span class="sub">永远的兰兰 · RSS 阅读器</span>
  </div>
  <div class="right-btn">
    <a href="https://github.com/podcatcher962/DrillFeed/releases/latest" target="_blank">💻 桌面版</a>
  </div>
</div>
<div class="info-bar">
  <a href="#" onclick="showModal('help');return false">📖 使用说明</a>
  <a href="#" onclick="showModal('disclaimer');return false">⚠ 免责声明</a>
  <a href="#" onclick="showModal('about');return false">ℹ 关于</a>
  <span>📋 15 内置源</span>
</div>
<div class="main">
  <div class="left" id="feedList"></div>
  <div class="right">
    <div class="load-status" id="loadStatus">点击左侧源开始阅读</div>
    <div class="article-list" id="articleList"><div class="empty-state">⬅ 选择一个 RSS 源</div></div>
    <div class="content-area" id="contentArea"><em>点击文章标题查看详情</em></div>
  </div>
</div>
<footer><a href="https://github.com/podcatcher962/DrillFeed" target="_blank">github.com/podcatcher962/DrillFeed</a> · © 永远的兰兰 · RSS 版权归源站所有</footer>

<div id="modalOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999;align-items:center;justify-content:center">
  <div style="background:#FFF;border-radius:10px;max-width:540px;width:90%;max-height:80vh;overflow-y:auto;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.2);font-size:13px;line-height:1.7">
    <h2 style="margin:0 0 12px;font-size:18px" id="modalTitle"></h2>
    <div id="modalBody" style="white-space:pre-wrap"></div>
    <button onclick="document.getElementById('modalOverlay').style.display='none'" style="margin-top:16px;padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:14px">✕ 关闭</button>
  </div>
</div>

<script>
const PRESET_FEEDS={
  '📰 科技快讯':[['36氪','https://36kr.com/feed'],['IT之家','https://www.ithome.com/rss/'],['爱范儿','https://www.ifanr.com/feed'],['雷锋网','https://www.leiphone.com/feed'],['极客公园','https://www.geekpark.net/rss']],
  '💻 数字生活':[['少数派','https://sspai.com/feed'],['小众软件','https://www.appinn.com/feed']],
  '📚 技术博客':[['Solidot奇客','https://www.solidot.org/index.rss'],['InfoQ技术','https://www.infoq.cn/feed'],['阮一峰','https://www.ruanyifeng.com/blog/atom.xml'],['月光博客','https://feed.williamlong.info/']],
  '🌐 社会·生活':[['界面新闻','https://a.jiemian.com/index.php?m=article&a=rss'],['理想生活','https://www.toodaylab.com/feed'],['机核','https://www.gcores.com/rss']],
  '💰 投资理财':[['雪球热门','https://xueqiu.com/hots/topic/rss']]
};

const MODAL={help:'📖 DrillFeed 使用说明\n\n左侧分类树点击展开源列表。共 15 个内置 RSS 源，分 5 个分类。\n\n点击源名加载文章，右侧显示文章列表。\n再点击文章标题在下方查看摘要。\n\n浏览器 CORS 限制导致部分 RSS 源无法直接加载，Web 版使用 rss2json 第三方代理获取。\n\n桌面版 Python 无 CORS 限制，支持后台自动更新、朗读、SQLite 本地缓存等功能。\n\n⚠ 极少数源可能无法加载，属浏览器安全限制。',
  disclaimer:'⚠️ 免责声明\n\n1. 本工具仅供个人学习研究使用。RSS 内容版权归源站所有。\n2. 通过 rss2json 第三方代理获取 RSS 数据，源数据原样呈现。\n3. 本软件按"原样"（AS-IS）提供，不提供任何明示或暗示的担保。\n4. 使用者须遵守所在地法律法规。',
  about:'DrillFeed v1.1\n\n开源 RSS 阅读器\n15 内置源 / 5 分类\n\n桌面版: Python 3 + tkinter + SQLite, 13MB\nWeb 版: 纯 HTML + CSS + JS, 单文件\n\nGitHub: https://github.com/podcatcher962/DrillFeed\n© 永远的兰兰'};

let feeds=JSON.parse(localStorage.getItem('dffeeds')||'null');
if(!feeds||localStorage.getItem('dfver')!=='2'){feeds=JSON.parse(JSON.stringify(PRESET_FEEDS));saveFeeds();localStorage.setItem('dfver','2')}
let currentFeed='',articles=[],selectedIdx=-1;

function saveFeeds(){localStorage.setItem('dffeeds',JSON.stringify(feeds))}

function renderFeedList(){
  var list=document.getElementById('feedList');list.innerHTML='';
  for(var cat in feeds){
    var group=document.createElement('div');group.className='cat-group';
    var h=document.createElement('div');h.className='cat-header';h.textContent=cat+' ('+feeds[cat].length+')';
    h.onclick=function(c){return function(){toggleCat(c)}}(cat);
    group.appendChild(h);
    feeds[cat].forEach(function(f){
      var item=document.createElement('div');
      item.className='feed-item'+(f[1]===currentFeed?' active':'');
      var nameSpan=document.createElement('span');nameSpan.textContent=f[0];
      var urlSpan=document.createElement('span');urlSpan.className='url-hint';urlSpan.textContent=f[1].replace(/https?:\/\//,'').slice(0,25);
      item.appendChild(nameSpan);item.appendChild(urlSpan);
      item.title=f[1];
      item.onclick=function(url){return function(){loadFeed(url)}}(f[1]);
      group.appendChild(item);
    });
    list.appendChild(group);
  }
}

function toggleCat(catName){
  var groups=document.querySelectorAll('.cat-group');
  groups.forEach(function(g){
    var h=g.querySelector('.cat-header');
    if(h.textContent.indexOf(catName)===0){
      var items=g.querySelectorAll('.feed-item');
      var vis=items.length>0&&items[0].style.display!=='none';
      items.forEach(function(i){i.style.display=vis?'none':''});
    }
  });
}

async function loadFeed(url){
  currentFeed=url;selectedIdx=-1;articles=[];
  document.getElementById('articleList').innerHTML='<div class="empty-state">⏳ 加载中...</div>';
  document.getElementById('contentArea').innerHTML='<em>加载中...</em>';
  document.getElementById('loadStatus').textContent='⏳ 正在加载: '+url.replace(/https?:\/\//,'').slice(0,40)+'...';
  renderFeedList();
  try{
    var data=null;
    try{
      var pr=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)+'&count=25');
      var json=await pr.json();
      if(json.status==='ok'&&json.items){
        data=json.items.map(function(i){return[cleanText(i.title),i.link||'',i.pubDate||'',cleanText(i.description||i.content||'').slice(0,1200)]});
      }
    }catch(e){}
    if(!data){try{
      var r=await fetch(url+((url.indexOf('?')>=0)?'&':'?')+'_t='+Date.now());
      if(r.ok){var xml=await r.text();data=parseXML(xml)}
    }catch(e){}}
    if(data&&data.length){articles=data;renderArticles();document.getElementById('loadStatus').textContent='✅ '+data.length+' 篇文章'}
    else{document.getElementById('articleList').innerHTML='<div class="empty-state">❌ 此源无法加载<br><br>桌面版可正常使用（无 CORS 限制）</div>';document.getElementById('loadStatus').textContent='❌ 加载失败'}
  }catch(e){document.getElementById('articleList').innerHTML='<div class="empty-state">❌ '+e.message+'</div>'}
}

function parseXML(xml){
  var items=[];var p=new DOMParser();var d=p.parseFromString(xml,'text/xml');
  d.querySelectorAll('item,entry').forEach(function(e){
    var t=e.querySelector('title');t=t?t.textContent:'';
    var l=e.querySelector('link');l=l?(l.textContent||l.getAttribute('href')||''):'';
    if(l&&l.startsWith('/'))l=new URL(currentFeed).origin+l;
    var dt=e.querySelector('pubDate,published,updated');dt=dt?dt.textContent:'';
    var desc=e.querySelector('description,summary,content');desc=desc?desc.textContent:'';
    if(t)items.push([cleanText(t),l,dt,cleanText(desc).slice(0,1200)]);
  });
  return items.length?items.slice(0,25):null;
}

function cleanText(t){if(!t)return'';return t.replace(/<!\[CDATA\[|\]\]>|<\/?[^>]+>/g,'').trim()}

function renderArticles(){
  var list=document.getElementById('articleList');list.innerHTML='';
  articles.forEach(function(a,i){
    var div=document.createElement('div');
    div.className='art-item'+(i===selectedIdx?' selected':'');
    div.innerHTML='<div class="art-title">'+a[0]+'</div><div class="art-meta">'+formatDate(a[2])+'</div>';
    div.onclick=function(){selectArticle(i)};
    list.appendChild(div);
  });
}

function selectArticle(i){
  selectedIdx=i;renderArticles();
  var a=articles[i];
  document.getElementById('contentArea').innerHTML='<h3><a href="'+a[1]+'" target="_blank">'+a[0]+'</a></h3><div class="summary">'+a[3]+'</div><p style="margin-top:4px"><a href="'+a[1]+'" target="_blank">🔗 阅读原文</a></p>';
  document.getElementById('contentArea').scrollTop=0;
}

function formatDate(d){
  if(!d)return'';try{var dt=new Date(d);if(isNaN(dt.getTime()))return'';return dt.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return d.slice(0,16)}
}

function showModal(key){
  document.getElementById('modalTitle').textContent=key==='help'?'📖 使用说明':key==='disclaimer'?'⚠️ 免责声明':'ℹ 关于';
  document.getElementById('modalBody').textContent=MODAL[key];
  document.getElementById('modalOverlay').style.display='flex';
  document.getElementById('modalOverlay').onclick=function(e){if(e.target===this)this.style.display='none'};
}

renderFeedList();
</script>
</body>
</html>
