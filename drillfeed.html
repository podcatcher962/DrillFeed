<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DrillFeed · RSS 阅读器</title>
<style>
:root{--bg:#F5F5F5;--card:#FFF;--accent:#7C4DFF;--fg:#212121;--fg2:#757575;--border:#E0E0E0;--green:#43A047;--orange:#FF9100;--red:#FF5252;--blue:#448AFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei UI','PingFang SC',sans-serif;background:var(--bg);color:var(--fg);max-width:680px;margin:0 auto;padding:8px;min-height:100vh;display:flex;flex-direction:column}
.title-bar{flex-shrink:0;background:var(--accent);color:#fff;padding:12px 16px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:space-between}
.title-bar h1{font-size:18px;margin:0}
.title-bar .sub{font-size:12px;opacity:0.85}
.right-btn{display:flex;gap:6px}
.right-btn a,.right-btn button{background:#4A148C;color:#fff;text-decoration:none;padding:6px 12px;border:none;border-radius:4px;font-size:12px;white-space:nowrap;font-weight:600;cursor:pointer}
.info-bar{flex-shrink:0;display:flex;gap:12px;padding:6px 16px;background:#F3E5FF;border:1px solid var(--accent);border-top:none;font-size:12px;font-weight:600;flex-wrap:wrap}
.info-bar a{color:var(--accent);text-decoration:none}
.info-bar a:hover{text-decoration:underline}
.info-bar span{color:var(--fg2);margin-left:auto}
.cat-bar{flex-shrink:0;display:flex;gap:4px;padding:6px 10px;background:#EFE7FA;border:1px solid var(--accent);border-top:none;border-bottom:none;flex-wrap:wrap;align-items:center}
.cat-btn{padding:5px 10px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:5px;background:var(--card);cursor:pointer;white-space:nowrap;color:var(--accent)}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.add-bar{flex-shrink:0;display:flex;gap:4px;padding:6px 10px;background:var(--card);border:1px solid var(--border);border-top:none}
.add-bar input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;outline:none}
.add-bar button{padding:5px 10px;background:var(--green);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600}
.add-bar .refresh{background:var(--blue)}
.feed-row{flex-shrink:0;display:flex;gap:4px;padding:6px 10px;background:var(--card);border:1px solid var(--border);border-top:none;flex-wrap:wrap}
.feed-btn{padding:4px 8px;font-size:10px;font-weight:600;border:1px solid var(--border);border-radius:4px;background:var(--card);cursor:pointer;white-space:nowrap}
.feed-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.feed-btn:hover{background:#E0D0FF}
.article-list{flex:1;min-height:200px;background:var(--card);border:1px solid var(--border);border-top:none;overflow-y:auto}
.art-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #F0F0F0;font-size:13px;line-height:1.6}
.art-item:hover{background:#F8F4FF}
.art-item.selected{background:#EEE8FF;border-left:3px solid var(--accent)}
.art-item .art-title{font-weight:600;margin-bottom:3px}
.art-item .art-meta{font-size:10px;color:var(--fg2)}
.content-area{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-top:none;padding:12px 14px;max-height:220px;overflow-y:auto;font-size:13px;line-height:1.7;border-radius:0 0 8px 8px}
.content-area h3{margin-bottom:6px;color:var(--accent);font-size:14px}
.content-area .desc{color:var(--fg);font-size:12px;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.content-area a{color:var(--accent)}
.empty-state{text-align:center;padding:30px 20px;color:var(--fg2);font-size:13px}
footer{flex-shrink:0;text-align:center;color:var(--fg2);font-size:10px;padding:10px 0 6px}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:480px){.cat-btn,.feed-btn{padding:3px 6px;font-size:10px}}
</style>
</head>
<body>
<div class="title-bar">
  <div style="display:flex;align-items:center;gap:12px">
    <h1>🔬 DrillFeed</h1>
    <span class="sub">永远的兰兰 · RSS 阅读器</span>
  </div>
  <div class="right-btn">
    <a href="https://github.com/podcatcher962/DrillFeed/releases/latest" target="_blank">💻 桌面版</a>
  </div>
</div>
<div class="info-bar">
  <a href="#" onclick="showModal('help');return false">📖 使用说明</a>
  <a href="#" onclick="showModal('disclaimer');return false">⚠ 免责声明</a>
  <a href="#" onclick="showModal('about');return false">ℹ 关于</a>
  <span>📋 6 内置源 + CORS 代理</span>
</div>
<div class="cat-bar" id="catBar"></div>
<div class="feed-row" id="feedRow"></div>
<div class="add-bar">
  <input id="feedInput" placeholder="输入 RSS 订阅地址（自动识别分类）...">
  <button onclick="addFeed()">＋ 添加</button>
  <button class="refresh" onclick="refreshCurrent()">🔄 刷新</button>
</div>
<div class="article-list" id="articleList"><div class="empty-state">选择一个订阅源开始阅读</div></div>
<div class="content-area" id="contentArea"><em>点击文章标题查看详情</em></div>
<footer><a href="https://github.com/podcatcher962/DrillFeed" target="_blank">github.com/podcatcher962/DrillFeed</a> · © 永远的兰兰 · RSS 版权归源站所有</footer>

<div id="modalOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999;align-items:center;justify-content:center">
  <div style="background:#FFF;border-radius:10px;max-width:540px;width:90%;max-height:80vh;overflow-y:auto;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.2);font-size:13px;line-height:1.7">
    <h2 style="margin:0 0 12px;font-size:18px" id="modalTitle"></h2>
    <div id="modalBody" style="white-space:pre-wrap"></div>
    <button onclick="document.getElementById('modalOverlay').style.display='none'" style="margin-top:16px;padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:14px">✕ 关闭</button>
  </div>
</div>

<script>
const DEFAULT_FEEDS={
  '📰 科技':[['36氪','https://36kr.com/feed'],['少数派','https://sspai.com/feed'],['InfoQ','https://www.infoq.cn/feed'],['Solidot','https://www.solidot.org/index.rss']],
  '📚 资讯':[['知乎日报','https://www.zhihu.com/rss'],['阮一峰','https://feeds.feedburner.com/ruanyifeng']]
};
const T={zh:{help:'📖 DrillFeed 使用说明\n\n浏览器 CORS 限制导致部分 RSS 源无法直接加载，已自动使用 rss2json 代理。\n\n📰 顶部分类条：科技、资讯等。点击切换该分类下的所有源。\n📋 源名按钮：点击切换源，下方显示该源的最新文章。\n＋ 添加：输入 RSS 地址，点添加即可自定义订阅源。\n🔄 刷新：重新加载当前源。\n\n文章列表：点击标题查看全文。\n⚠ 极少数 RSS 源有任何 CORS 机制可能无法加载。',
  disclaimer:'⚠️ 免责声明\n\n1. 本工具仅供个人学习研究使用。RSS 内容版权归源站所有。\n2. 通过 rss2json 第三方代理获取 RSS 数据，源数据原样呈现。\n3. 本软件按"原样"（AS-IS）提供，不提供任何明示或暗示的担保。\n4. 使用者须遵守所在地法律法规。',
  about:'DrillFeed v1.1\n\n开源 RSS 阅读器 / Open-source RSS Reader\n6 个内置源 + 自定义添加\n\n桌面版: Python 3 + tkinter, 13MB\nWeb 版: 纯 HTML + CSS + JS, 单文件\n\nGitHub: https://github.com/podcatcher962/DrillFeed\n© 永远的兰兰'}};

let feeds=JSON.parse(localStorage.getItem('dffeeds')||'null');
if(!feeds){
  feeds={};
  for(let cat in DEFAULT_FEEDS)feeds[cat]=DEFAULT_FEEDS[cat].slice();
  saveFeeds();
}
let currentCat='全部',currentFeed='',articles=[],selectedIdx=-1;

function saveFeeds(){localStorage.setItem('dffeeds',JSON.stringify(feeds))}

function renderCats(){
  var bar=document.getElementById('catBar');bar.innerHTML='';
  var cats=Object.keys(feeds);
  var full=['全部'];
  ['📰 科技','📚 资讯'].forEach(function(c){if(cats.indexOf(c)>=0)full.push(c)});
  cats.forEach(function(c){if(full.indexOf(c)<0)full.push(c)});
  full.forEach(function(c){
    var btn=document.createElement('button');
    btn.className='cat-btn'+(currentCat===c?' active':'');
    btn.textContent=c;btn.onclick=function(){switchCat(c)};
    bar.appendChild(btn);
  });
  var addCat=document.createElement('button');
  addCat.className='cat-btn';addCat.textContent='＋ 分类';addCat.style.color='var(--green)';
  addCat.onclick=addCategory;bar.appendChild(addCat);
}

function renderFeeds(){
  var row=document.getElementById('feedRow');row.innerHTML='';
  var list=currentCat==='全部'?
    Object.keys(feeds).reduce(function(a,c){return a.concat(feeds[c])},[]):
    feeds[currentCat]||[];
  list.forEach(function(f){
    var btn=document.createElement('button');
    btn.className='feed-btn'+(f[1]===currentFeed?' active':'');
    btn.textContent=f[0];btn.title=f[1];
    btn.onclick=function(){loadFeed(f[1])};
    row.appendChild(btn);
  });
}

function switchCat(cat){
  currentCat=cat;currentFeed='';
  renderCats();renderFeeds();
  document.getElementById('articleList').innerHTML='<div class="empty-state">选择一个订阅源开始阅读</div>';
  document.getElementById('contentArea').innerHTML='<em>点击文章标题查看详情</em>';
}

function addCategory(){
  var name=prompt('输入新分类名称：','');
  if(!name||!name.trim())return;
  feeds[name.trim()]=[];
  saveFeeds();renderCats();
}

function addFeed(){
  var url=document.getElementById('feedInput').value.trim();
  if(!url)return;
  if(!url.startsWith('http'))url='https://'+url;
  var cat=currentCat==='全部'?Object.keys(feeds)[0]||'自定义':currentCat;
  var name=url.replace(/https?:\/\//,'').replace(/\/.*/,'').slice(0,20);
  if(!feeds[cat])feeds[cat]=[];
  if(!feeds[cat].some(function(f){return f[1]===url})){
    feeds[cat].push([name,url]);
    saveFeeds();renderCats();
  }
  document.getElementById('feedInput').value='';
  loadFeed(url);
}

function refreshCurrent(){if(currentFeed)loadFeed(currentFeed)}

async function loadFeed(url){
  currentFeed=url;selectedIdx=-1;articles=[];
  document.getElementById('articleList').innerHTML='<div class="empty-state">⏳ 加载中...</div>';
  document.getElementById('contentArea').innerHTML='<em>加载中...</em>';
  renderFeeds();
  try{
    var data=null;
    // Try with rss2json proxy (handles CORS)
    try{
      var pr=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)+'&count=30');
      var json=await pr.json();
      if(json.status==='ok'&&json.items){
        data=json.items.map(function(i){return[cleanText(i.title),i.link,i.pubDate||i.pub_date||'',cleanText(i.description||i.content||'').slice(0,800)]});
      }
    }catch(e){}
    // Try direct fetch as fallback
    if(!data){
      try{
        var r=await fetch(url+((url.indexOf('?')>=0)?'&':'?')+'_t='+Date.now());
        if(r.ok){
          var xml=await r.text();
          data=parseXML(xml);
        }
      }catch(e){}
    }
    if(data&&data.length){
      articles=data;
      renderArticles();
    }else{
      document.getElementById('articleList').innerHTML='<div class="empty-state">❌ 无法加载此源<br><br>可能原因：<br>• RSS 源不支持 CORS<br>• 网络问题<br>• 源已被删除</div>';
    }
  }catch(e){
    document.getElementById('articleList').innerHTML='<div class="empty-state">❌ 加载失败: '+e.message+'</div>';
  }
}

function parseXML(xml){
  var items=[];var parser=new DOMParser();var doc=parser.parseFromString(xml,'text/xml');
  var entries=doc.querySelectorAll('item,entry');
  for(var i=0;i<Math.min(entries.length,30);i++){
    var e=entries[i];
    var title=e.querySelector('title');title=title?title.textContent:'';
    var link=e.querySelector('link');link=link?(link.textContent||link.getAttribute('href')||''):'';
    if(link&&link.startsWith('/'))link=currentFeed?new URL(currentFeed).origin+link:'';
    var date=e.querySelector('pubDate,published,updated');date=date?date.textContent:'';
    var desc=e.querySelector('description,summary,content');desc=desc?desc.textContent:'';
    items.push([cleanText(title),link,date,cleanText(desc).slice(0,800)]);
  }
  return items.length?items:null;
}

function cleanText(t){if(!t)return '';return t.replace(/<!\[CDATA\[|\]\]>|<\/?[^>]+>/g,'').trim()}

function renderArticles(){
  var list=document.getElementById('articleList');list.innerHTML='';
  if(!articles.length){list.innerHTML='<div class="empty-state">暂无文章</div>';return}
  articles.forEach(function(a,i){
    var div=document.createElement('div');
    div.className='art-item'+(i===selectedIdx?' selected':'');
    div.innerHTML='<div class="art-title">'+a[0]+'</div><div class="art-meta">'+formatDate(a[2])+'</div>';
    div.onclick=function(){selectArticle(i)};
    list.appendChild(div);
  });
}

function selectArticle(i){
  selectedIdx=i;renderArticles();
  var a=articles[i];
  document.getElementById('contentArea').innerHTML=
    '<h3><a href="'+a[1]+'" target="_blank">'+a[0]+'</a></h3>'+
    '<div class="desc">'+a[3]+'</div>'+
    '<p style="margin-top:6px"><a href="'+a[1]+'" target="_blank" style="font-size:12px">🔗 阅读原文</a></p>';
  document.getElementById('contentArea').scrollTop=0;
}

function formatDate(d){
  if(!d)return '';
  try{var dt=new Date(d);if(isNaN(dt.getTime()))return'';return dt.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return d.slice(0,16)}
}

function showModal(key){
  document.getElementById('modalTitle').textContent=key==='help'?'📖 使用说明':key==='disclaimer'?'⚠️ 免责声明':'ℹ 关于';
  document.getElementById('modalBody').textContent=T.zh[key];
  document.getElementById('modalOverlay').style.display='flex';
  document.getElementById('modalOverlay').onclick=function(e){if(e.target===this)this.style.display='none'};
}

renderCats();renderFeeds();
</script>
</body>
</html>
